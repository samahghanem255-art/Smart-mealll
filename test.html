<!DOCTYPE html><html><body>
<h2>اختبار قاعدة البيانات</h2>
<button onclick="testDB()">جرب الحفظ الآن</button>
<div id="res"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supa = supabase.createClient('https://xvghguxdgezhiowswvsd.supabase.co','sb_publishable_Sk-ark6LufVu-zOWxf6Ozg_ecumaQvG');
async function testDB(){
  document.getElementById('res').innerText='جاري المحاولة...';
  let {data, error} = await supa.from('meal_orders').insert([{
    nom:'اختبار', telephone:'0555555555', adresse:'قسنطينة',
    articles:'دجاج', prix:450,
    date_commande: new Date().toISOString().split('T')[0],
    heure: new Date().toLocaleTimeString()
  }]).select();

    document.getElementById('res').innerHTML = '<b style=color:red>خطأ:</b><br>'+JSON.stringify(error,null,2);

    document.getElementById('res').innerHTML = '<b style=color:green>✅ نجح الحفظ!</b><br>ID: '+data[0].id;
  }
}
</script></body></html>
