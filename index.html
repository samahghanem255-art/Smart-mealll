<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Meal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- APP -->
<div id="app">

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">🍽 Smart Meal</div>

  <ul class="nav-links">
    <li><a href="#home">الرئيسية</a></li>
    <li><a href="#menu">القائمة</a></li>
    <li><a href="#contact">تواصل</a></li>
  </ul>

  <button class="cart-btn" onclick="toggleCart()">
    🛒 <span id="cartCount">0</span>
  </button>
</header>

<!-- HERO -->
<section id="home" class="hero">
  <h1>مذاق استثنائي 🍔</h1>
  <p>وجبات سريعة - صحية - طازجة</p>
  <a href="#menu" class="btn">ابدأ الطلب</a>
</section>

<!-- MENU -->
<section id="menu" class="menu">

  <div class="card">
    <img src="https://i.ibb.co/yF0fngXw/IMG-1631.jpg">
    <h3>دجاج مشوي فاخر</h3>
    <p>وجبة طازجة ولذيذة</p>
    <div class="price">450 دج</div>
    <button onclick="addToCart('دجاج مشوي فاخر',450)">إضافة</button>
  </div>

</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <h2>تواصل معنا</h2>
  <iframe 
    src="https://maps.google.com/maps?q=Algeria&t=&z=13&output=embed"
    width="100%" height="200">
  </iframe>
</section>

</div>

<!-- CART MODAL -->
<div id="cartModal" class="cart-modal">
  <div class="cart-box">
    <h2>🛒 السلة</h2>

    <div id="cartItems"></div>

    <div class="cart-footer">
      <span>المجموع: <b id="total">0 دج</b></span>
      <button onclick="checkout()">تأكيد الطلب</button>
    </div>

    <button class="close" onclick="toggleCart()">إغلاق</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
