<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Meal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.supabaseClient=supabase.createClient('https://xvghguxdgezhiowswvsd.supabase.co','sb_publishable_Sk-ark6LufVu-zOWxf6Ozg_ecumaQvG');</script><style>body{font-family:Tahoma;background:#f5f5f5;margin:0}header{background:#000;color:#fff;padding:15px;display:flex;justify-content:space-between} .card{background:#fff;margin:15px;padding:15px;border-radius:10px}button{background:#000;color:#fff;padding:10px 15px;border:none;border-radius:6px;cursor:pointer} .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9999}.modal-overlay.active{display:flex}.modal{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:400px}</style></head><body><header><b>Smart Meal</b><button onclick="openCart()">🛒 <span id="cartCount">0</span></button></header><div class="card"><h3>دجاج مشوي</h3><p>450 دج</p><button onclick="addToCart('دجاج مشوي',450,320)">أضف للسلة</button></div><div class="card"><h3>وجبة أرز</h3><p>450 دج</p><button onclick="addToCart('وجبة أرز',450,480)">أضف للسلة</button></div><div class="card"><h3>باستا</h3><p>450 دج</p><button onclick="addToCart('باستا',450,550)">أضف للسلة</button></div><div class="card"><h3>معلومات الزبون</h3><input id="customerName" placeholder="اسمك" style="width:100%;padding:10px;margin:5px 0"><input id="customerPhone" placeholder="هاتفك" style="width:100%;padding:10px;margin:5px 0"><textarea id="deliveryAddress" placeholder="عنوانك" style="width:100%;padding:10px"></textarea><button onclick="confirmOrder()" style="width:100%;margin-top:10px">ادفع الآن</button></div><div class="modal-overlay" id="cartModal"><div class="modal"><button onclick="closeCart()">✕</button><h3>🛒 السلة</h3><div id="cartItems"></div><p>المجموع: <b id="cartTotal">0</b> دج</p><p>سعرات: <b id="cartCalTotal">0</b></p><button onclick="confirmOrder()">تأكيد</button></div></div><script>let cart=[];function openCart(){document.getElementById('cartModal').classList.add('active')}function closeCart(){document.getElementById('cartModal').classList.remove('active')}function addToCart(n,p,c){cart.push({n,p,c});let t=cart.reduce((s,i)=>s+i.p,0);let ct=cart.reduce((s,i)=>s+i.c,0);document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartTotal').innerText=t;document.getElementById('cartCalTotal').innerText=ct;let h='';cart.forEach(i=>{h+='<p>'+i.n+' - '+i.p+' دج</p>'});document.getElementById('cartItems').innerHTML=h;openCart()}async function confirmOrder(){let nom=document.getElementById('customerName').value.trim();let telephone=document.getElementById('customerPhone').value.trim();let adresse=document.getElementById('deliveryAddress').value.trim();let prix=parseInt(document.getElementById('cartTotal').innerText||'0')||0;if(!nom||!telephone){alert('ادخل الاسم والهاتف');return}let now=new Date();let date_commande=now.toISOString().split('T')[0];let heure=now.toLocaleTimeString('fr-DZ',{hour:'2-digit',minute:'2-digit'});let{error}=await window.supabaseClient.from('meal_orders').insert([{nom,telephone,adresse,prix,date_commande,heure}]);if(error){alert(error.message)}else{alert('✅ تم الطلب');cart=[];document.getElementById('cartCount').innerText='0';closeCart()}}</script></body></html>
