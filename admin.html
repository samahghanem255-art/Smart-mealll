<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Smart Meal</title>
<style>
body{font-family:system-ui;background:#f5f5f5;margin:0;padding:20px}
.login{max-width:400px;margin:100px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
.admin{display:none}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center}
.btn{padding:10px 18px;border:0;border-radius:8px;cursor:pointer}
.btn-del{background:#ff4444;color:#fff}
.btn-login{background:#ff6b00;color:#fff;width:100%;font-size:18px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>

<div id="loginPage" class="login">
<h2>🔐 دخول الأدمن</h2>
<input type="password" id="pass" placeholder="كلمة السر">
<button class="btn btn-login" onclick="login()">دخول</button>
<p id="err" style="color:red"></p>
</div>

<div id="adminPage" class="admin">
<h2>📦 طلبات Smart Meal <button onclick="loadOrders()" style="float:left">🔄 تحديث</button></h2>
<div id="orders">جاري التحميل...</div>
<button onclick="logout()" style="margin-top:20px">خروج</button>
</div>

<script>
const SUPA_URL="https://qdknzgbpipbmghsmdjwj.supabase.co";
const SUPA_KEY="sb_publishable__zunCTxVSFeSrWMVFQvJXw_Co45RocM";
const ADMIN_PASS="smart123"; // غيري كلمة السر هنا

function login(){
  if(document.getElementById('pass').value===ADMIN_PASS){
    localStorage.setItem('admin','yes');
    showAdmin();
  } else {
    document.getElementById('err').innerText='كلمة السر خاطئة';
  }
}
function showAdmin(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  loadOrders();
}
function logout(){ localStorage.removeItem('admin'); location.reload(); }

async function loadOrders(){
  const res=await fetch(SUPA_URL+"/rest/v1/meal_orders?order=created_at.desc",{
    headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
  });
  const data=await res.json();
  const div=document.getElementById('orders');
  if(!data.length){ div.innerHTML='<p>لا يوجد طلبات</p>'; return; }
  div.innerHTML=data.map(o=>`
    <div class="card">
      <div>
        <b>👤 ${o.nom}</b> - 📞 ${o.telephone}<br>
        📍 ${o.adresse||''}<br>
        🍱 ${o.articles}<br>
        💰 ${o.prix} دج - ⏰ ${o.heure||''} - 📅 ${o.date_commande||''}
      </div>
      <button class="btn btn-del" onclick="delOrder('${o.id}')">حذف</button>
    </div>
  `).join('');
}
async function delOrder(id){
  if(!confirm('حذف الطلب؟')) return;
  await fetch(SUPA_URL+"/rest/v1/meal_orders?id=eq."+id,{method:"DELETE",headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}});
  loadOrders();
}
if(localStorage.getItem('admin')==='yes') showAdmin();
</script>
</body>
</html>
