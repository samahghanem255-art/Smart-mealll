<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Admin Meal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma;background:#eee;padding:20px}
.box{max-width:400px;margin:100px auto;background:#fff;padding:25px;border-radius:10px;text-align:center}
input{width:100%;padding:12px;margin:12px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:6px;cursor:pointer}
#admin{display:none}
.item{background:#fff;padding:12px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="login" class="box">
<h3>دخول الادمن</h3>
<input id="pwd" type="password" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
</div>

<div id="admin">
<h2>طلبات الوجبات (<span id="num">0</span>)</h2>
<div id="list"></div>
</div>

<script>
const sb = supabase.createClient('https://txyaplmxsfvhqztkgesg.supabase.co','sb_publishable_bi3B6opJuNEhZIm6kUCeVA_QLdDynxj');

function login(){
let p=document.getElementById('pwd').value;
if(p.trim()==='Samah 123'){
document.getElementById('login').style.display='none';
document.getElementById('admin').style.display='block';
getData();
}else{
alert('خطأ في كلمة السر');
}
}

async function getData(){
let {data}=await sb.from('meal_orders').select('*').order('created_at',{ascending:false});
document.getElementById('num').innerText=data.length;
let h='';
data.forEach(r=>{
h+=`<div class="item"><div>${r.nom} - ${r.telephone}<br><small>${r.date_commande} ${r.heure} - ${r.prix} DA</small></div><button onclick="del('${r.id}')" style="width:auto;background:red">حذف</button></div>`;
});
document.getElementById('list').innerHTML=h||'لا يوجد طلبات';
}

async function del(id){
if(confirm('حذف؟')){
await sb.from('meal_orders').delete().eq('id',id);
getData();
}
}
</script>
</body>
</html>
